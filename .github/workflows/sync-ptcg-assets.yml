# Mirror upstream ptcg-assets repo into public/ptcg-assets/ (.git excluded).
# Triggers: manual (workflow_dispatch) + weekly cron (UTC).

name: Sync ptcg-assets (full) into public

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout upstream (full shallow clone)
        uses: actions/checkout@v4
        with:
          repository: 1niceroli/ptcg-assets
          ref: main
          path: .upstream-ptcg-assets
          fetch-depth: 1

      - name: Mirror into public/ptcg-assets (exclude .git)
        run: |
          mkdir -p public
          rm -rf public/ptcg-assets
          mkdir -p public/ptcg-assets
          rsync -a --delete --exclude='.git/' .upstream-ptcg-assets/ public/ptcg-assets/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ptcg-assets
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync ptcg-assets (full mirror)"
            git push
          fi
